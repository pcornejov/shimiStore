<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shimiStore</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; font-family: sans-serif; color: #fff;
         background: linear-gradient(#121838, #58229a); }
  h1 { font-size: 4rem; margin: 0 0 1rem; }
  p { font-size: 1.6rem; margin: .3rem; opacity: .85; }
  code { color: #ffc43d; }
</style>
</head>
<body>
<h1>Hola desde shimiStore</h1>
<p>El payload está corriendo en la PS5.</p>
<p id="estado">…</p>
<script>
  fetch('/api/estado').then(r => r.json()).then(e => {
    document.getElementById('estado').innerHTML =
      'Versión <code>' + e.version + '</code> · encendido hace <code>' + e.segundos + ' s</code>';
  });
</script>
</body>
</html>
